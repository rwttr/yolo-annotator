<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YOLO Annotator · Lab</title>
  <link rel="icon" href="icon.png">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1b1b1b; }
    canvas#annotator { position: absolute; inset: 0; width: 100%; height: 100%; outline: none; }
    #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
               color: #bbb; font: 16px system-ui, sans-serif; }
  </style>
</head>
<body>
  <canvas id="annotator"></canvas>
  <div id="loading">Loading YOLO Annotator…</div>
  <script type="module">
    import init from "./annot_web.js";
    init().then(() => document.getElementById("loading").remove())
          .catch((e) => { document.getElementById("loading").textContent = "Could not start: " + e; });
  </script>
</body>
</html>
