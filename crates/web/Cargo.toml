[package]
name = "annot-web"
version.workspace = true
edition = "2021"
license = "MIT"
description = "YOLO Annotator web client (WebAssembly): the shared UI on the lab server"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
annot-core = { path = "../core" }
annot-ui = { path = "../ui" }
eframe = { version = "0.29", features = ["persistence"] }
serde_json = "1"
ewebsock = "0.7"
ehttp = "0.5"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Location", "Document", "HtmlCanvasElement", "Element", "console", "Storage"] }
