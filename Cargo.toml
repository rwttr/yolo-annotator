[workspace]
members = ["crates/core", "crates/ai", "crates/ui", "crates/server", "crates/web"]
resolver = "2"

[workspace.package]
version = "0.3.1"

[package]
name = "yolo-annotator"
version.workspace = true
edition = "2021"
authors = ["DotoRobotics"]
license = "MIT"
description = "Simple mouse-driven image annotator (box / polygon / polyline) that writes Ultralytics YOLO labels"

[dependencies]
eframe = { version = "0.29", features = ["persistence"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "webp", "tiff", "ico"] }
annot-core = { path = "crates/core" }
annot-ai = { path = "crates/ai" }
annot-ui = { path = "crates/ui" }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4

# Decode images fast even in debug builds
[profile.dev.package."*"]
opt-level = 2
